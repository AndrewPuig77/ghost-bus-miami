#cloud-config
# First-boot setup: Docker, a deploy folder, automatic security updates, key-only SSH.
package_update: true
package_upgrade: true
packages:
  - docker.io
  - docker-compose-v2
  - rsync
  - unattended-upgrades

write_files:
  - path: /etc/ssh/sshd_config.d/90-ghostbus.conf
    content: |
      PasswordAuthentication no
      PermitRootLogin no

runcmd:
  - systemctl enable --now docker
  - usermod -aG docker ubuntu
  - mkdir -p /opt/ghostbus
  - chown ubuntu:ubuntu /opt/ghostbus
  - systemctl restart ssh

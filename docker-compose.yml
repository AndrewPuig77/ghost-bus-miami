services:
  db:
    build: ./db
    # shared_buffers: Postgres's own cache. Small by default; set PG_SHARED_BUFFERS on a server
    # (about 25% of RAM is the usual guidance).
    command: postgres -c shared_buffers=${PG_SHARED_BUFFERS:-128MB}
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Runs database migrations once, then exits. The API and worker wait for it.
  migrate:
    build: ./backend
    command: alembic upgrade head
    env_file: .env
    depends_on:
      db:
        condition: service_healthy

  api:
    build: ./backend
    command: uvicorn app.api.main:app --host 0.0.0.0 --port 8000
    env_file: .env
    restart: unless-stopped
    # Local access only; browsers reach the API through the web service.
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  worker:
    build: ./backend
    command: python -m app.worker.main
    env_file: .env
    # Must run 24/7: restart after crashes and after Docker or the machine restarts.
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  # The built map app behind Caddy, which also forwards /api and /ws to the API.
  web:
    build: ./frontend
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - "${WEB_PORT:-8080}:80"
    volumes:
      - caddy_data:/data
    depends_on:
      - api

volumes:
  pgdata:
  caddy_data:
